<svg xmlns="http://www.w3.org/2000/svg" viewBox="220 135 360 380" width="360" height="380">
  <defs>
    <!-- Drop shadow for 3D elements -->
    <filter id="dropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur" />
      <feOffset in="blur" dx="3" dy="6" result="offset" />
      <feComponentTransfer in="offset" result="shadow">
        <feFuncA type="linear" slope="0.75" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur" />
      <feOffset in="blur" dx="2" dy="4" result="offset" />
      <feComponentTransfer in="offset" result="shadow">
        <feFuncA type="linear" slope="0.65" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gold Gradients for 3D Facets -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="25%" stop-color="#F2DFB0" />
      <stop offset="60%" stop-color="#DFC48B" />
      <stop offset="100%" stop-color="#C5A467" />
    </linearGradient>

    <linearGradient id="goldMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFC48B" />
      <stop offset="50%" stop-color="#C5A467" />
      <stop offset="100%" stop-color="#9C7B42" />
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5844A" />
      <stop offset="40%" stop-color="#7B5E2C" />
      <stop offset="100%" stop-color="#4E3715" />
    </linearGradient>

    <linearGradient id="textGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5CA92" />
      <stop offset="35%" stop-color="#C2A164" />
      <stop offset="70%" stop-color="#917036" />
      <stop offset="100%" stop-color="#6E5023" />
    </linearGradient>
  </defs>

  <!-- EMBLEM GROUP WITH 3D SHADOW -->
  <g filter="url(#dropShadow)">
    <!-- 1. TOP DIAMOND JEWEL -->
    <g transform="translate(400, 168)">
      <polygon points="0,-22 -17,0 0,0" fill="url(#goldLight)" />
      <polygon points="0,-22 17,0 0,0" fill="url(#goldMid)" />
      <polygon points="-17,0 0,22 0,0" fill="url(#goldMid)" />
      <polygon points="17,0 0,22 0,0" fill="url(#goldDark)" />
      <line x1="0" y1="-22" x2="0" y2="22" stroke="#FFF7DE" stroke-width="0.75" opacity="0.6" />
      <line x1="-17" y1="0" x2="17" y2="0" stroke="#FFF7DE" stroke-width="0.75" opacity="0.6" />
    </g>

    <!-- 2. ARCHITECTURAL MONOGRAM (K & N / ROOF & PORTAL) -->
    <g opacity="0.45" transform="translate(2, 4)">
      <path d="M 285 258 L 388 198 L 400 205 L 412 198 L 515 258 L 515 362 L 490 362 L 490 282 L 440 282 L 440 362 L 400 362 L 345 295 L 345 362 L 285 362 Z" fill="#000000" />
    </g>

    <polygon points="285,258 388,198 392,207 298,262" fill="url(#goldLight)" />
    <polygon points="298,262 392,207 386,220 306,268" fill="url(#goldDark)" />

    <polygon points="285,258 298,262 298,362 285,362" fill="url(#goldLight)" />
    <polygon points="298,262 312,268 312,362 298,362" fill="url(#goldMid)" />

    <polygon points="412,198 515,258 503,264 408,207" fill="url(#goldLight)" />
    <polygon points="503,264 515,258 515,270 420,218" fill="url(#goldDark)" />

    <polygon points="515,258 515,362 500,362 500,265" fill="url(#goldDark)" />
    <polygon points="500,265 500,362 485,362 485,275" fill="url(#goldMid)" />

    <polygon points="312,310 405,235 418,245 330,320" fill="url(#goldLight)" />
    <polygon points="330,320 418,245 412,258 338,328" fill="url(#goldDark)" />

    <polygon points="328,295 428,382 414,394 316,308" fill="url(#goldLight)" />
    <polygon points="428,382 438,374 340,285 328,295" fill="url(#goldMid)" />
    <polygon points="414,394 428,382 438,374 426,400" fill="url(#goldDark)" />

    <polygon points="420,248 435,260 435,362 422,362" fill="url(#goldMid)" />
    <polygon points="435,260 445,268 445,362 435,362" fill="url(#goldLight)" />

    <polygon points="445,282 485,282 485,294 445,294" fill="url(#goldDark)" />
    <polygon points="485,282 485,362 472,362 472,294" fill="url(#goldDark)" />
    <rect x="445" y="294" width="27" height="68" fill="#121212" opacity="0.5" />

    <path d="M 285 258 L 388 198 M 412 198 L 515 258" stroke="#FFF8E7" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />
    <path d="M 312 310 L 405 235 M 328 295 L 428 382" stroke="#FFF8E7" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />
    <line x1="285" y1="258" x2="285" y2="362" stroke="#FFF8E7" stroke-width="1" opacity="0.75" />
  </g>

  <!-- 3. BRAND NAME: KRISHNAVENI -->
  <g filter="url(#softShadow)" text-anchor="middle">
    <text x="400" y="455"
          fill="url(#textGold)"
          font-family="Cormorant Garamond, Cinzel, serif, -apple-system, BlinkMacSystemFont, Segoe UI"
          font-size="37"
          font-weight="700"
          letter-spacing="0.16em">KRISHNAVENI</text>

    <!-- Subtitle: INTERIORS -->
    <text x="400" y="492"
          fill="#9C7B42"
          font-family="Plus Jakarta Sans, Montserrat, sans-serif, -apple-system, BlinkMacSystemFont"
          font-size="14.5"
          font-weight="700"
          letter-spacing="0.38em">INTERIORS</text>
  </g>
</svg>